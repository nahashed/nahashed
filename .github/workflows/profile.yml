name: Update profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'nahashed/nahashed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: "2.9.5"
      - name: Check generator
        run: deno task check && deno task test
      - name: Collect and render overview
        env:
          PROFILE_READ_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
        run: deno task update
      - name: Publish changed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- assets/stack-light.svg assets/stack-dark.svg
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(profile): обновляет сводку языков и технологий'
          credential=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$credential"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $credential" git push origin HEAD:main
